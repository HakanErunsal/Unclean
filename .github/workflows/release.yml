name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve release version
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "unclean-core" } | Select-Object -First 1).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match workspace version $version. Correct the tag or workspace version."
          }
          "UNCLEAN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check public repository files
        run: |
          node scripts/check-foundation.mjs
          node scripts/check-public-text.mjs
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.97.1"
          command: check
          arguments: --all-features
      - name: Install release tools
        run: |
          cargo install --locked cargo-about --version 0.9.1 --features cli
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Package executables and notices
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:UNCLEAN_VERSION
      - name: Generate console SBOM
        run: cargo cyclonedx --manifest-path crates/unclean-cli/Cargo.toml --format json --describe binaries --target x86_64-pc-windows-msvc --spec-version 1.5 --license-strict
      - name: Generate desktop SBOM
        run: cargo cyclonedx --manifest-path crates/unclean-gui/Cargo.toml --format json --describe binaries --target x86_64-pc-windows-msvc --spec-version 1.5 --license-strict
      - name: Stage SBOM files
        shell: pwsh
        run: |
          Copy-Item crates/unclean-cli/unclean_bin.cdx.json "dist/Unclean-$env:UNCLEAN_VERSION-unclean.cdx.json"
          Copy-Item crates/unclean-gui/unclean-gui_bin.cdx.json "dist/Unclean-$env:UNCLEAN_VERSION-unclean-gui.cdx.json"
      - name: Attest release package
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: dist/Unclean-${{ env.UNCLEAN_VERSION }}-windows-x86_64.zip
      - name: Attest console SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: dist/Unclean-${{ env.UNCLEAN_VERSION }}-windows-x86_64.zip
          sbom-path: dist/Unclean-${{ env.UNCLEAN_VERSION }}-unclean.cdx.json
      - name: Attest desktop SBOM
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: dist/Unclean-${{ env.UNCLEAN_VERSION }}-windows-x86_64.zip
          sbom-path: dist/Unclean-${{ env.UNCLEAN_VERSION }}-unclean-gui.cdx.json
      - name: Retain workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Unclean-${{ env.UNCLEAN_VERSION }}-windows-x86_64
          path: |
            dist/Unclean-${{ env.UNCLEAN_VERSION }}-windows-x86_64.zip
            dist/Unclean-${{ env.UNCLEAN_VERSION }}-windows-x86_64.sha256
            dist/Unclean-${{ env.UNCLEAN_VERSION }}-unclean.cdx.json
            dist/Unclean-${{ env.UNCLEAN_VERSION }}-unclean-gui.cdx.json
          if-no-files-found: error
      - name: Publish immutable release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists for $env:GITHUB_REF_NAME. Increment the version and create a new tag."
          }
          gh release create $env:GITHUB_REF_NAME `
            "dist/Unclean-$env:UNCLEAN_VERSION-windows-x86_64.zip" `
            "dist/Unclean-$env:UNCLEAN_VERSION-windows-x86_64.sha256" `
            "dist/Unclean-$env:UNCLEAN_VERSION-unclean.cdx.json" `
            "dist/Unclean-$env:UNCLEAN_VERSION-unclean-gui.cdx.json" `
            --verify-tag `
            --notes-file RELEASE_NOTES.md `
            --prerelease `
            --draft `
            --title "Unclean $env:UNCLEAN_VERSION"
          gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease
