[workspace]
members = [
    "crates/unclean-cli",
    "crates/unclean-core",
    "crates/unclean-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/HakanErunsal/Unclean"

[workspace.dependencies]
clap = "4.6.4"
embed-resource = "3.0.11"
eframe = { version = "0.35.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
globset = { version = "0.4.19", default-features = false }
jsonc-parser = { version = "0.33.0", default-features = false }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.19"
toml_edit = { version = "0.25.13", default-features = false, features = ["display", "parse"] }
unclean-core = { version = "0.1.0-alpha.2", path = "crates/unclean-core" }
winreg = "0.56.0"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
